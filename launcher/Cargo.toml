[package]
name = "studiowine"
version = "0.2.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
ureq = "3"
ttf-parser = "0.25"
sha2 = "0.11"
lnk = "0.6"
pelite = "0.10"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11", "wayland", "clipboard"] }
egui = "0.37"
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["ico", "png", "bmp"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
